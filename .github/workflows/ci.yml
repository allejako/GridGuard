name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmbedtls-dev \
            libsqlite3-dev \
            cmake \
            libgtest-dev

      - name: Build
        run: make all

      - name: Run tests (ASAN/UBSAN)
        env:
          GRIDGUARD_JWT_SECRET: gridguard-ci-test-secret
        run: make test-gtest
